<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day 2027</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Floating Background -->
<div class="background"></div>

<!-- Hero Section -->

<section class="hero reveal">

<img src="img/gif1.gif" class="gif" alt="gif">

<h1>HAPPY FRIENDSHIP DAY 🫂</h1>

<p class="scroll">⬇ Scroll Down ⬇</p>

</section>

<!-- Second GIF -->

<section class="reveal">

<img src="img/gif2.gif" class="gif" alt="gif">

</section>

<!-- Forever Box -->

<section class="reveal">

<div class="glass">

<h2>Always Friends Forever ♾️</h2>

</div>

</section>

<!-- Wishes -->

<section class="reveal">

<h2 class="title">Wishes</h2>

<div class="glass typing-box">

<p id="typing"></p>

</div>

</section>

<!-- Music -->

<section class="reveal">

<h2 class="title">Song</h2>

<img src="img/gif3.gif" class="gif small" alt="gif">

<div class="music-box">

<audio id="song">

<source src="music/song.mp3" type="audio/mp3">

</audio>

<button id="playBtn">

▶ Play Song

</button>

</div>

</section>

<!-- Memories -->

<section class="reveal">

<h2 class="title">Memories</h2>

<div class="slider">

<div class="slides">

<img src="img/pic1.jpg">

<img src="img/pic2.jpg">

<img src="img/pic3.jpg">

</div>

</div>

</section>

<!-- Thank You -->

<section class="reveal">

<h2 class="thanks">

THANK YOU FOR EXIST ❤️

</h2>

</section>

<!-- Last GIF -->

<section class="reveal">

<img src="img/gif1.gif" class="gif" alt="gif">

</section>

<!-- Footer -->

<footer>

<p>Made by <span>Satyam Singh</span></p>

</footer>

<script src="script.js"></script>

</body>

</html>
